<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Background circle -->
  <circle cx="50" cy="50" r="48" fill="#F97316" opacity="0.95"/>

  <!-- Zen enso circle (incomplete circle representing enlightenment) -->
