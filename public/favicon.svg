          stroke-linecap="round" stroke-dasharray="200 20" opacity="0.9"/>

  <!-- Inner meditation symbol -->
  <circle cx="50" cy="50" r="8" fill="#FDE68A" opacity="0.8"/>

  <!-- Subtle timer dots (like clock markers) -->
  <circle cx="50" cy="22" r="2.5" fill="#FDE68A" opacity="0.6"/>
  <circle cx="78" cy="50" r="2.5" fill="#FDE68A" opacity="0.6"/>
  <circle cx="50" cy="78" r="2.5" fill="#FDE68A" opacity="0.6"/>
  <circle cx="22" cy="50" r="2.5" fill="#FDE68A" opacity="0.6"/>
</svg>
